<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <meta
            name="description"
            content="Aplicativo de previsão do tempo utilizando a API Open-Meteo"
        />

        <title>Previsão do Tempo</title>

        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.12/css/weather-icons.min.css"
        />
        <link rel="stylesheet" href="./assets/css/style.css" />
    </head>

    <body class="periodo-dia">
        <main class="container">
            <section class="card" aria-labelledby="titulo-app">
                <div class="topo-card">
                    <h1 id="titulo-app">Previsão do Tempo</h1>

                    <button
                        type="button"
                        id="botao-tema"
                        class="botao-tema"
                        aria-pressed="false"
                    >
                        Tema escuro
                    </button>
                </div>

                <p class="descricao">
                    Digite o nome de uma cidade para consultar a temperatura
                    atual.
                </p>

                <form id="form-clima">
                    <label for="cidade">Cidade</label>

                    <input
                        type="text"
                        id="cidade"
                        name="cidade"
                        placeholder="Ex: São Paulo"
                        autocomplete="address-level2"
                        required
                    />

                    <button type="submit">Buscar clima</button>
                </form>

                <p id="mensagem" role="status" aria-live="polite"></p>

                <section id="resultado" class="resultado" aria-live="polite">
                    <div class="clima-resumo">
                        <i
                            id="icone-clima"
                            class="wi wi-na"
                            aria-hidden="true"
                        ></i>

                        <div>
                            <h2 id="nome-cidade"></h2>
                            <p id="descricao-clima" class="descricao-clima"></p>
                        </div>
                    </div>

                    <p class="temperatura">
                        <span id="temperatura"></span>
                    </p>

                    <div class="detalhes-clima" aria-label="Detalhes do clima atual">
                        <p>
                            <span>Umidade</span>
                            <strong id="umidade-atual"></strong>
                        </p>

                        <p>
                            <span>Vento</span>
                            <strong id="vento-atual"></strong>
                        </p>

                        <p>
                            <span>Precipitação</span>
                            <strong id="precipitacao-atual"></strong>
                        </p>
                    </div>

                    <p id="data-consulta" class="data-consulta"></p>

                    <section class="previsao" aria-labelledby="titulo-previsao">
                        <h3 id="titulo-previsao">Próximos 5 dias</h3>
                        <div id="previsao-lista" class="previsao-lista"></div>
                    </section>
                </section>
            </section>
        </main>

        <script src="./assets/js/api.js"></script>
    </body>
</html>
